name: developer
think_time: { kind: lognormal, mu: 1.2, sigma: 0.7, scale: 1s }
jitter: { kind: proportional, fraction: 0.15 }
burst:
  active: { kind: exponential, mean: 90s }
  idle: { kind: lognormal, mu: 2.2, sigma: 0.6, scale: 1s }
time_of_day:
  location: "America/Los_Angeles"
  weekday: [0.03, 0.02, 0.01, 0.01, 0.01, 0.02, 0.05, 0.10, 0.30, 0.60, 0.85, 0.95, 0.80, 0.95, 1.00, 0.95, 0.90, 0.80, 0.60, 0.50, 0.45, 0.35, 0.20, 0.08]
  weekend: [0.04, 0.03, 0.02, 0.01, 0.01, 0.01, 0.02, 0.05, 0.10, 0.20, 0.35, 0.50, 0.55, 0.60, 0.60, 0.55, 0.50, 0.45, 0.40, 0.40, 0.35, 0.30, 0.20, 0.10]
session:
  length: { kind: normal, mean: 45m, stddev: 15m, min: 10m, max: 3h }
  inter_task: { kind: lognormal, mu: 1.3, sigma: 0.8, scale: 1s }
  abandon: 0.02
mix:
  - { protocol: ssh, verb: run, cause: navigation, pacing: shaper-managed, weight: 4 }
  - { protocol: http, verb: fetch-page, cause: navigation, pacing: shaper-managed, weight: 4 }
  - { protocol: dns, verb: resolve-name, cause: navigation, pacing: shaper-managed, weight: 2 }
fingerprints: default
