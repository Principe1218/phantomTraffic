version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - depguard
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        no-math-rand:
          list-mode: lax
          files:
            - '!**/internal/rng/**'
            - '!**/internal/behavior/**'
          deny:
            - pkg: 'math/rand'
              desc: 'non-CSPRNG: math/rand is allowed only in internal/rng and internal/behavior. Use crypto/rand via internal/idgen for security-sensitive values, or the injected rng.Rand for traffic shaping.'
            - pkg: 'math/rand/v2'
              desc: 'non-CSPRNG: math/rand/v2 is allowed only in internal/rng and internal/behavior. Use crypto/rand via internal/idgen for security-sensitive values, or the injected rng.Rand for traffic shaping.'
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^time\.Now$'
          msg: 'inject clock.Clock and call Now(); time.Now is banned in internal/behavior for determinism'
        - pattern: '^time\.Sleep$'
          msg: 'the engine performs the sleep via clock.Clock; time.Sleep is banned in internal/behavior'
        # Primary control: handlers/behavior receive an injected rng.Rand and must
        # not call package-global rand functions. This pattern is a secondary lint
        # reminder. Note: an aliased `math/rand/v2` import could evade this check,
        # but depguard still confines that import to internal/rng and internal/behavior.
        - pattern: '^rand\.'
          msg: 'use the injected rng.Rand, not a package-global rand function, inside internal/behavior'
  exclusions:
    rules:
      # forbidigo applies ONLY inside internal/behavior and internal/persona (both
      # are inside the determinism boundary and must never call time.Now/time.Sleep
      # or a package-global rand): exclude it everywhere else.
      # Go regexp has no negative lookahead, so path-except (positive match) is used.
      - path-except: '(^|/)internal/(behavior|persona)/'
        linters:
          - forbidigo
